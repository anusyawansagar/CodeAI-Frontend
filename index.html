<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CodeAI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <aside class="sidebar" id="sidebar">

        <div class="brand">
            <div class="logo">&lt;/&gt;</div>

            <div>
                <h2>CodeAI</h2>
                <span>AI Assistant</span>
            </div>
        </div>

        <button class="new-chat" onclick="newChat()">
            + New Chat
        </button>

        <div class="chat-search">
            <input
                id="chatSearch"
                type="text"
                placeholder="Search chats..."
                oninput="renderChatList()"
            >
        </div>

        <div class="chat-list" id="chatList"></div>

        <div class="sidebar-section">

            <p>MODE</p>

            <select id="language">
                <option>General</option>
                <option>Python</option>
                <option>JavaScript</option>
                <option>HTML</option>
                <option>CSS</option>
                <option>C</option>
                <option>C++</option>
                <option>Java</option>
                <option>Rust</option>
                <option>SQL</option>
            </select>

        </div>

        <div class="sidebar-bottom">
            <button onclick="showAbout()">Settings</button>
            <button onclick="showAbout()">About CodeAI</button>
        </div>

    </aside>


    <main class="chat">

        <header class="topbar">

            <button
                class="mobile-menu"
                onclick="toggleSidebar()"
                aria-label="Menu"
            >
                ☰
            </button>

            <div>
                <h1 id="chatTitle">CodeAI</h1>
                <p>Intelligent AI assistant</p>
            </div>

            <div class="status">
                <span></span>
                Online
            </div>

        </header>


        <section id="messages" class="messages">

            <div class="welcome">

                <div class="welcome-icon">&lt;/&gt;</div>

                <h2>Welcome to CodeAI</h2>

                <p>
                    Ask questions, write code, analyze files,
                    read documents, understand images and more.
                </p>

                <div class="suggestions">

                    <button onclick="useSuggestion('Explain Python loops')">
                        Explain Python loops
                    </button>

                    <button onclick="useSuggestion('Help me debug my code')">
                        Debug my code
                    </button>

                    <button onclick="useSuggestion('Help me build a website')">
                        Build a website
                    </button>

                    <button onclick="useSuggestion('What should I learn in JavaScript?')">
                        Learning path
                    </button>

                </div>

            </div>

        </section>


        <div class="bottom-area">

            <div id="attachmentPreview" class="attachment-preview"></div>

            <div class="input-area">

                <div class="input-box">

                    <button
                        id="attachButton"
                        class="tool-button"
                        onclick="toggleTools()"
                        title="Tools"
                    >
                        +
                    </button>

                    <textarea
                        id="userInput"
                        placeholder="Ask CodeAI anything..."
                        rows="1"
                        onkeydown="handleKey(event)"
                    ></textarea>

                    <button
                        id="micButton"
                        class="tool-button"
                        onclick="startVoiceInput()"
                        title="Voice input"
                    >
                        Mic
                    </button>

                    <button
                        id="sendButton"
                        onclick="sendMessage()"
                    >
                        ➤
                    </button>

                </div>

                <p class="disclaimer">
                    CodeAI can make mistakes. Check important information.
                </p>

            </div>


            <div id="toolsMenu" class="tools-menu">

                <button onclick="selectFile()">
                    Upload File
                </button>

                <button onclick="selectFolder()">
                    Upload Folder
                </button>

                <button onclick="selectImage()">
                    Upload Image
                </button>

                <button onclick="openCamera()">
                    Take Photo
                </button>

                <button onclick="createPDFFromChat()">
                    Create PDF
                </button>

            </div>


            <input
                id="fileInput"
                type="file"
                hidden
                onchange="handleFile(event)"
            >

            <input
                id="imageInput"
                type="file"
                accept="image/*"
                hidden
                onchange="handleImage(event)"
            >

            <input
                id="folderInput"
                type="file"
                webkitdirectory
                directory
                multiple
                hidden
                onchange="handleFolder(event)"
            >


            <div class="ad-container">

                <span class="ad-label">
                    ADVERTISEMENT
                </span>

                <div class="ad-box">
                    <p>Advertisement</p>
                </div>

            </div>

        </div>

    </main>

</div>


<div id="cameraModal" class="camera-modal">

    <div class="camera-panel">

        <h3>Camera</h3>

        <video
            id="cameraVideo"
            autoplay
            playsinline
        ></video>

        <canvas
            id="cameraCanvas"
            hidden
        ></canvas>

        <div class="camera-buttons">

            <button onclick="closeCamera()">
                Cancel
            </button>

            <button onclick="capturePhoto()">
                Capture
            </button>

        </div>

    </div>

</div>


<script src="script.js"></script>

</body>
</html>
